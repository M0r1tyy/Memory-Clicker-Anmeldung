<head>
  <link rel="stylesheet" href="http://localhost:8000/style/panel.css">
</head>
<button id="nav-toggle" onclick="toggleNav()">☰</button>


<script>
  function toggleNav() {
    const panel = document.getElementById("nav-panel");
    panel.classList.toggle("open");
  }

  // aktive seite markieren
  const links = document.querySelectorAll("#nav-panel a");
  links.forEach(link => {
    if (link.href === window.location.href) {
      link.classList.add("aktiv");
    }
  });

  // klick außerhalb schließt panel
  document.addEventListener("click", function (e) {
    const panel = document.getElementById("nav-panel");
    const toggle = document.getElementById("nav-toggle");
    if (!panel.contains(e.target) && !toggle.contains(e.target)) {
      panel.classList.remove("open");
    }
  });
</script>

<div id="nav-panel">
  <h3>Navigation</h3>
  <a href="/public/index.php">🏠 Startseite</a>
  <a href="/public/memory.html">🃏 Memory</a>
  <a href="/public/statistik.html">📊 Statistik</a>
</div>
