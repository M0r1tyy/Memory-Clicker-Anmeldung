<html>

<head>
  <link rel="stylesheet" href="http://localhost:8000/style/memory.css">
</head>

<body>
  <div id="top">
    <div id="title-block">
      <h1>Memory Spiel</h1>
      <p>Wähle die Anzahl der Karten aus</p>
      <select id="sizeSelect" onchange="selectSize(event)">
        <option value="2">2 Karten</option>
        <option value="8">8 Karten</option>
        <option value="18">18 Karten</option>
        <option value="32">32 Karten</option>
        <option value="50">50 Karten</option>
        <option value="72">72 Karten</option>
      </select>
      <span id="attempts" style="display:none"></span>
      <span id="winCount" style="display:none"></span>
    </div>

    <div id="player-info">
      <p id="currentPlayer">Spieler 1 ist dran</p>
      <span id="p1pairs" style="display:none"></span>
      <span id="p2pairs" style="display:none"></span>
    </div>
  </div>
  <br>
  <div id="board"></div>

  <dialog id="winDialog">
    <h2>Gewonnen!!</h2>
    <p id="dialogResult"></p>
    <button id="closeDialog" onclick="onDialogCloseBtn(this)">Continue</button>
  </dialog>

  <head>
    <link rel="stylesheet" href="http://localhost:8000/style/panel.css">
  </head>




  <script src="http://localhost:8000/js/memory.js"></script>
  <script src="http://localhost:8000/js/panel.js"></script>

</body>

</html>
